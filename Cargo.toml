[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
    "bin/node",
    "crates/utilities/cli",
    "crates/utilities/test-utils",
    "crates/execution/runner",
    "crates/execution/flashblocks",
    "crates/execution/flashblocks-node",
]

default-members = ["bin/node"]

[workspace.dependencies]
# internal
ethgas-reth-flashblocks = { path = "crates/execution/flashblocks" }
ethgas-flashblocks-node = { path = "crates/execution/flashblocks-node" }
ethgas-node-runner = { path = "crates/execution/runner" }
ethgas-cli-utils = { path = "crates/utilities/cli" }
ethgas-test-utils = { path = "crates/utilities/test-utils" }

# reth
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-rpc-eth-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-e2e-test-utils = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-primitives-traits = { version = "0.6.0", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-cli-util = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-exex = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-db = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-testing-utils = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-rpc = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-rpc-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-rpc-layer = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-ipc = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-chain-state = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.1" }

# revm
revm = { version = "42.0.1", default-features = false }
revm-bytecode = { version = "42.0.0", default-features = false }

# alloy
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-foldhash",
] }
alloy-genesis = { version = "2.3.0", default-features = false }
alloy-eips = { version = "2.3.0", default-features = false }
alloy-rpc-types = { version = "2.3.0", default-features = false }
alloy-rpc-types-engine = { version = "2.3.0", default-features = false }
alloy-rpc-types-eth = { version = "2.3.0" }
alloy-consensus = { version = "2.3.0", default-features = false }
alloy-trie = { version = "0.9.4", default-features = false }
alloy-provider = { version = "2.3.0" }
alloy-hardforks = { version = "0.4.7" }
alloy-rpc-client = { version = "2.3.0" }
alloy-serde = { version = "2.3.0" }
alloy-network = { version = "2.3.0" }
alloy-signer = { version = "2.3.0" }
alloy-signer-local = { version = "2.3.0" }
alloy-sol-macro = { version = "1.6.1" }
alloy-sol-types = { version = "1.6.1" }
alloy-contract = { version = "2.3.0" }

# tokio
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.17"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }

# async
futures = "0.3.31"
futures-util = "0.3"
reqwest = { version = "0.13.1", features = ["json", "stream"] }

# rpc
jsonrpsee = "0.26.0"
jsonrpsee-types = "0.26.0"

# misc
clap = { version = "4.5.57" }
tracing = { version = "0.1.43" }
serde = "1.0.228"
serde_json = "1.0.145"
url = "2.5"
metrics = "0.24.3"
metrics-derive = "0.1"
itertools = "0.14"
eyre = { version = "0.6.12" }
uuid = { version = "1.21", features = ["serde", "v5", "v4"] }
time = { version = "0.3.44", features = ["macros", "formatting", "parsing"] }
brotli = "8.0.2"
arc-swap = "1.7.1"
once_cell = "1.19"
rand = "0.9.2"
thiserror = "2"
rstest = "0.26.1"
tracing-subscriber = "0.3.22"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rust.rust_2024_incompatible_pat = "warn"
rustdoc.all = "warn"
# rust.unnameable-types = "warn"

[workspace.lints.clippy]
# These are some of clippy's nursery (i.e., experimental) lints that we like.
# By default, nursery lints are allowed. Some of the lints below have made good
# suggestions which we fixed. The others didn't have any findings, so we can
# assume they don't have that many false positives. Let's enable them to
# prevent future problems.
borrow_as_ptr = "warn"
branches_sharing_code = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
empty_line_after_doc_comments = "warn"
empty_line_after_outer_attr = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
flat_map_option = "warn"
if_not_else = "warn"
if_then_some_else_none = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
iter_without_into_iter = "warn"
large_stack_frames = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_is_variant_and = "warn"
manual_string_new = "warn"
match_same_arms = "warn"
missing-const-for-fn = "warn"
mutex_integer = "warn"
naive_bytecount = "warn"
needless_bitwise_bool = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
read_zero_byte_vec = "warn"
result_large_err = "allow"
redundant_clone = "warn"
redundant_else = "warn"
single_char_pattern = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_undefined_repr = "warn"
trivial_regex = "warn"
tuple_array_conversions = "warn"
type_repetition_in_bounds = "warn"
uninhabited_references = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unnested_or_patterns = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
while_float = "warn"
zero_sized_map_values = "warn"

# These are nursery lints which have findings. Allow them for now. Some are not
# quite mature enough for use in our codebase and some we don't really want.
# Explicitly listing should make it easier to fix in the future.
as_ptr_cast_mut = "allow"
cognitive_complexity = "allow"
debug_assert_with_mut_call = "allow"
fallible_impl_from = "allow"
future_not_send = "allow"
needless_collect = "allow"
non_send_fields_in_send_ty = "allow"
redundant_pub_crate = "allow"
significant_drop_in_scrutinee = "allow"
significant_drop_tightening = "allow"
too_long_first_doc_paragraph = "allow"

