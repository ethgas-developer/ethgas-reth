[package]
name = "ethgas-node"
version.workspace = true
edition.workspace = true

[dependencies]
# internal
ethgas-reth-flashblocks.workspace = true
ethgas-flashblocks-node.workspace = true
ethgas-node-runner.workspace = true
ethgas-cli-utils.workspace = true

# reth
reth-ethereum-cli.workspace = true
reth-cli-util.workspace = true

# Only used to forward the `jemalloc` feature to rocksdb & keccak features.
reth-provider.workspace = true
alloy-primitives.workspace = true

# misc
clap.workspace = true
humantime.workspace = true
url.workspace = true

[features]
default = ["jemalloc", "asm-keccak", "keccak-cache-global"]

jemalloc = [
    "reth-cli-util/jemalloc",
    "reth-ethereum-cli/jemalloc",
    "reth-provider/jemalloc",
]
jemalloc-prof = [
    "jemalloc",
    "reth-cli-util/jemalloc-prof",
    "reth-ethereum-cli/jemalloc-prof",
]
asm-keccak = [
    "reth-ethereum-cli/asm-keccak",
    "alloy-primitives/asm-keccak",
]
keccak-cache-global = ["alloy-primitives/keccak-cache-global"]

[lints]
workspace = true
