name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly rustfmt
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt --no-self-update

      - name: cargo fmt --check
        run: cargo +nightly fmt --all --check

  test:
    name: clippy & test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --profile ci -- -D warnings

      - name: cargo test
        run: cargo test --workspace --profile ci
