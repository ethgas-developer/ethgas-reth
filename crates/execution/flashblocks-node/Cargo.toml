[package]
name = "ethgas-flashblocks-node"
description = "Flashblocks node extension for the Ethgas node"
version.workspace = true
edition.workspace = true

[features]
test-utils = [
    "ethgas-node-runner/test-utils",
    "dep:ethgas-test-utils",
    "dep:derive_more",
    "dep:eyre",
    "dep:reth-chainspec",
    "dep:reth-ethereum-primitives",
    "dep:reth-primitives-traits",
    "dep:reth-transaction-pool",
    "dep:alloy-consensus",
    "dep:alloy-eips",
    "dep:alloy-primitives",
    "dep:alloy-rpc-types-engine",
]

[dependencies]
# internal
ethgas-reth-flashblocks.workspace = true
ethgas-node-runner.workspace = true

# reth
reth-provider.workspace = true

# tokio
tokio.workspace = true
tokio-stream.workspace = true

# tracing
tracing.workspace = true

# test-utils (optional)
ethgas-test-utils = { workspace = true, optional = true }
derive_more = { version = "2", optional = true, features = ["deref"] }
eyre = { workspace = true, optional = true }
reth-chainspec = { workspace = true, optional = true }
reth-ethereum-primitives = { workspace = true, optional = true }
reth-primitives-traits = { workspace = true, optional = true }
reth-transaction-pool = { workspace = true, optional = true, features = ["test-utils"] }
alloy-consensus = { workspace = true, optional = true }
alloy-eips = { workspace = true, optional = true }
alloy-primitives = { workspace = true, optional = true }
alloy-rpc-types-engine = { workspace = true, optional = true }

[dev-dependencies]
ethgas-flashblocks-node = { path = ".", features = ["test-utils"] }
ethgas-node-runner = { workspace = true, features = ["test-utils"] }
ethgas-reth-flashblocks.workspace = true
eyre.workspace = true
rand.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
reth-db.workspace = true
reth-revm.workspace = true
reth-evm.workspace = true
reth-ethereum-primitives.workspace = true
reth-testing-utils.workspace = true
reth-db-common.workspace = true
reth-e2e-test-utils.workspace = true
reth-rpc-eth-api.workspace = true
reth-provider.workspace = true
reth-chain-state.workspace = true
reth-trie-common.workspace = true
reth-chainspec.workspace = true
reth-node-api.workspace = true
reth-node-ethereum.workspace = true
reth-evm-ethereum.workspace = true
reth-primitives-traits.workspace = true
reth-tracing.workspace = true
reth-transaction-pool = { workspace = true, features = ["test-utils"] }
serde_json.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-network.workspace = true
alloy-signer.workspace = true
alloy-provider.workspace = true
alloy-rpc-types.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rpc-types-engine.workspace = true
alloy-sol-types = { workspace = true, features = ["std"] }

[lints]
workspace = true
