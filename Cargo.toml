[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
    "bin/node",
    "crates/utilities/cli",
    "crates/utilities/test-utils",
    "crates/execution/runner",
    "crates/execution/flashblocks",
    "crates/execution/flashblocks-node",
]

default-members = ["bin/node"]

[workspace.dependencies]
# internal
ethgas-reth-flashblocks = { path = "crates/execution/flashblocks" }
ethgas-flashblocks-node = { path = "crates/execution/flashblocks-node" }
ethgas-node-runner = { path = "crates/execution/runner" }
ethgas-cli-utils = { path = "crates/utilities/cli" }
ethgas-test-utils = { path = "crates/utilities/test-utils" }

# reth
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-rpc-eth-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-ethereum-cli = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-e2e-test-utils = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-primitives-traits = { version = "0.5.0", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-cli-util = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-exex = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-db = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-testing-utils = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-rpc = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-rpc-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-rpc-layer = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-ipc = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-chain-state = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.4.1" }

# revm
revm = { version = "41.0.0", default-features = false }
revm-bytecode = { version = "41.0.0", default-features = false }

# alloy
alloy-primitives = { version = "1.6.1", default-features = false, features = [
    "map-foldhash",
] }
alloy-genesis = { version = "2.1.1", default-features = false }
alloy-eips = { version = "2.1.1", default-features = false }
alloy-rpc-types = { version = "2.1.1", default-features = false }
alloy-rpc-types-engine = { version = "2.1.1", default-features = false }
alloy-rpc-types-eth = { version = "2.1.1" }
alloy-consensus = { version = "2.1.1", default-features = false }
alloy-trie = { version = "0.9.4", default-features = false }
alloy-provider = { version = "2.1.1" }
alloy-hardforks = { version = "0.4.7" }
alloy-rpc-client = { version = "2.1.1" }
alloy-serde = { version = "2.1.1" }
alloy-network = { version = "2.1.1" }
alloy-signer = { version = "2.1.1" }
alloy-signer-local = { version = "2.1.1" }
alloy-sol-macro = { version = "1.6.1" }
alloy-sol-types = { version = "1.6.1" }
alloy-contract = { version = "2.1.1" }

# tokio
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.17"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }

# async
futures = "0.3.31"
futures-util = "0.3"
reqwest = { version = "0.13.1", features = ["json", "stream"] }

# rpc
jsonrpsee = "0.26.0"
jsonrpsee-types = "0.26.0"

# misc
clap = { version = "4.5.57" }
tracing = { version = "0.1.43" }
serde = "1.0.228"
serde_json = "1.0.145"
url = "2.5"
metrics = "0.24.3"
metrics-derive = "0.1"
itertools = "0.14"
eyre = { version = "0.6.12" }
uuid = { version = "1.21", features = ["serde", "v5", "v4"] }
time = { version = "0.3.44", features = ["macros", "formatting", "parsing"] }
brotli = "8.0.2"
arc-swap = "1.7.1"
once_cell = "1.19"
rand = "0.9.2"
thiserror = "2"
rstest = "0.26.1"
tracing-subscriber = "0.3.22"
