[package]
name = "ethgas-node-runner"
version.workspace = true
edition.workspace = true

[features]
test-utils = [
    "dep:ethgas-test-utils",
    "dep:alloy-genesis",
    "dep:alloy-provider",
    "dep:alloy-rpc-client",
    "dep:alloy-rpc-types-engine",
    "dep:alloy-rpc-types-eth",
    "dep:alloy-signer",
    "dep:alloy-signer-local",
    "dep:jsonrpsee",
        "dep:reth-ipc",
    "dep:reth-node-core",
    "dep:reth-rpc-api",
    "dep:reth-rpc-layer",
    "dep:tracing-subscriber",
]

[dependencies]
# internal
ethgas-cli-utils.workspace = true
ethgas-test-utils = { workspace = true, optional = true }

# reth
reth-node-builder.workspace = true
reth-rpc-eth-types.workspace = true
reth-rpc.workspace = true
reth-rpc-convert.workspace = true
reth-evm.workspace = true
alloy-network.workspace = true
reth-rpc-eth-api.workspace = true
reth-node-api.workspace = true
reth-chainspec.workspace = true
reth-provider.workspace = true
reth-revm.workspace = true
reth-chain-state.workspace = true
reth-node-ethereum.workspace = true
reth-exex.workspace = true
reth-db = { workspace = true, features = ["test-utils"] }
reth-ethereum-primitives.workspace = true
reth-ipc = { workspace = true, optional = true }
reth-node-core = { workspace = true, optional = true }
reth-primitives-traits.workspace = true
reth-trie-common.workspace = true
reth-rpc-api = { workspace = true, optional = true }
reth-rpc-layer = { workspace = true, optional = true }
reth-tasks = { workspace = true }
tokio.workspace = true
reth-transaction-pool = { workspace = true, features = ["test-utils"] }

# alloy
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true, features = ["std"] }
alloy-genesis = { workspace = true, optional = true, features = ["std"] }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true, optional = true }
alloy-rpc-client = { workspace = true, optional = true }
alloy-rpc-types = { workspace = true }
alloy-rpc-types-engine = { workspace = true, optional = true, features = ["std"] }
alloy-rpc-types-eth = { workspace = true, optional = true }
alloy-signer = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }

# rpc
jsonrpsee = { workspace = true, optional = true }

# async
futures.workspace = true

# misc
eyre.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
ethgas-node-runner = { path = ".", features = ["test-utils"] }

[lints]
workspace = true
